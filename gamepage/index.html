<!DOCTYPE html>
<html lang="en">
	<head>
		<script src="../javascript/func.js"></script>
		<link rel="stylesheet" href="../styles/style.css"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script type="text/javascript">
const ball = {
  x: 400,
  y: 300,
  dx: 10,
  dy: 1,
  width: 20,
  height: 20,
  background: 'white',
}

const player1 = {
  x: 100,
  y: 300,
  width: 5,
  height: 50,
  background: 'green',
}

const player2 = {
  x: 700,
  y: 300,
  width: 5,
  height: 50,
  background: 'blue',
}

const score = {
  player1: 0,
  player2: 0,
}

const ballAngle = ball.dy;
const moveSpeed = 10;


const onmousedown = (event) => {
  document.getElementById("info").innerHTML = `clicked on ${event.clientX} / ${event.clientY}`;
}
const onkeydown = (event) => {
  if (event.keyCode == 87)
  player1.y -= moveSpeed;
  if (event.keyCode == 83)
  player1.y += moveSpeed;
  if (event.keyCode == 38)
  player2.y -= moveSpeed;
  if (event.keyCode == 40)
  player2.y += moveSpeed;
}


const draw = () => {
  const canvas = document.getElementById("canvas")
  const ctx = canvas.getContext("2d", {alpha: false}); // 2d context for painting

  // canvas background fill color
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ball
  ctx.fillStyle = ball.background;
  ctx.fillRect(ball.x, ball.y, ball.width, ball.height);

  // player1
  ctx.fillStyle = player1.background;
  ctx.fillRect(player1.x, player1.y, player1.width, player1.height);

  // player2
  ctx.fillStyle = player2.background;
  ctx.fillRect(player2.x, player2.y, player2.width, player2.height);

  // green square without fill color
  //ctx.beginPath();
  //ctx.lineWidth = 2;
  //ctx.strokeStyle = square.color;
  //ctx.rect(square.x, square.y, square.width, square.height);
  //ctx.stroke()

  //drawLine( ctx, [10, 10], [100, 150], 'green', 5);

  // move squares
  ball.x = ball.x + ball.dx;
  ball.y = ball.y + ball.dy;
  //square.x = square.x + square.dx;
  //square.y = square.y + square.dy;

  if ( (ball.x == player1.x && (ball.y >= player1.y || ball.y + ball.height >= player1.y) && (ball.y + ball.height <= player1.y + player1.height || ball.y <= player1.y + player1.height)) || ( ball.x + ball.width == player2.x && (ball.y >= player2.y || ball.y + ball.height >= player2.y) && (ball.y + ball.height <= player2.y + player2.height || ball.y <= player2.y + player2.height)))
  {
	ball.dx = -ball.dx;
	if ( ball.x > canvas.width / 2 )
	{
		ball.dy = ballAngle * -((((player2.y + (player2.height / 2)) - (ball.y + (ball.height / 2)))) / 5);
	}
	if ( ball.x < canvas.width / 2)
	{
		ball.dy = ballAngle * -((((player1.y + (player1.height / 2)) - (ball.y + (ball.height / 2)))) / 5);
	}
  }
  //if (ball.x + ball.width >= canvas.width || ball.y + ball.height >= canvas.height || ball.x <= 0 || ball.y <= 0 )
  if (ball.x >= canvas.width || (ball.x + ball.width >= player2.x + player2.width && (ball.y + ball.height >= canvas.height || ball.y <= 0 )))
  {
    ball.x = 400;
    ball.y = 300;
	ball.dy = ballAngle;
	ball.dx = -ball.dx;
    score.player1 ++;
  }

  if (ball.x + ball.width <= 0 || (ball.x <= player1.x && (ball.y + ball.height >= canvas.height || ball.y <= 0 )))
  {
    ball.x = 400;
    ball.y = 300;
	ball.dy = -ballAngle;
	ball.dx = -ball.dx;
    score.player2 ++;
  }

    if ((ball.x > (player1.x + player1.width) || ball.x < player2.x) && (ball.y <= 0 || (ball.y + ball.height) >= canvas.height))
  {
  ball.dy = -ball.dy;
  }

  document.getElementById("score").innerHTML = `Score: player1 ${score.player1} /  player2 ${score.player2}`;

}

// drawLine(ctx, [x1, y1], [x2, y2], 'green', 2)
const drawLine = (ctx, begin, end, stroke = 'black', width = 1) => {
  if (stroke) {
    ctx.strokeStyle = stroke;
  }

  if (width) {
    ctx.lineWidth = width;
  }

  ctx.beginPath();
  ctx.moveTo(...begin);
  ctx.lineTo(...end);
  ctx.stroke();
}

window.addEventListener("mousedown", onmousedown); // call `onmousedown` when the mouse is clicked
window.addEventListener("keydown", onkeydown);  // call `onkeydown` when a key is pressed

setInterval(draw, 100);  // call `drawCanvas` every 100 ms


		</script>
	</head>
 <body>
	<div class="sidebar">
		<ul>
			<li>
				<a href="../index.html"> Back to Mainpage  </a>
			</li>
			<li>
				<a href="../page1/index.html"> Page 1  </a>
			</li>
		</ul>
		<form>
			<ul class="buttonList">
				<li>
					<input type="radio" id="button1" name="redirect" onclick="buttonPressed = '..'"> Back to Mainpage </input>
				</li>
				<li>
					<input type="radio" id="button2" name="redirect" onclick="buttonPressed = '../page1'"> Page 1 </input>
				</li>
			</ul>
		</form>
		<input type="submit" value="Confirm" id="confirm" name="redirectConfirm" onclick="redirect(buttonPressed)"></input>
	</div>
	<div class="site">
		<canvas id="canvas" width="800" height="600"></canvas>
		<p id="score">You are currently reading this message because something seems to have gone wrong.</p>
	</div>
  </body>
</html>
